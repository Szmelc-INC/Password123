schema_version: 1
lessons:
  - id: "05-shamir-secret-sharing"
    title: "Shamir's Secret Sharing"
    module: "05-multiparty-and-hardware"
    category: "threshold-scheme"
    difficulty: "intermediate"
    status: "experimental"
    summary: "Split a secret into N shares so that any M reconstruct it and M-1 reveal nothing."
    recommended_for_new_systems: true
    labels: ["public", "encrypted", "browser-decryptable"]
    references:
      - name: "Shamir, How to Share a Secret (1979)"
        url: "https://doi.org/10.1145/359168.359176"
      - name: "Wikipedia: Shamir's secret sharing"
        url: "https://en.wikipedia.org/wiki/Shamir%27s_secret_sharing"
    vectors: ["vectors/multiparty/shamir-secret-sharing.yaml"]
    guide:
      what: >-
        The secret is the constant term of a random polynomial of degree M-1. Each share is one point on the polynomial. Any M points determine the polynomial by Lagrange interpolation; fewer points are consistent with every possible secret.
      problem: >-
        Recovery keys and root secrets can be held by several people so that no single person, lost device or stolen backup is enough.
      inputs_outputs: >-
        This repository's teaching implementation works byte-wise over GF(2^8) with polynomial 0x11b. A share is one x byte followed by one y byte per secret byte.
      key_management: >-
        Distribute shares over separate channels to separate custodians, record who holds which share, and test recovery. Re-share after a custodian leaves; old shares still combine with each other.
      common_mistakes:
        - "Reconstructing on one machine that then keeps the secret forever."
        - "Accepting shares without authentication; a malicious share silently corrupts the result (use verifiable secret sharing)."
        - "Using the x-coordinate 0, which is the secret itself."
      new_systems: "Yes, for recovery and custody, ideally with a reviewed library."
      reproduce: |
        p123 vectors verify --lesson 05-shamir-secret-sharing
    challenge:
      prompt: A secret was split 3-of-5 with byte-wise Shamir sharing over GF(2^8) (reduction polynomial 0x11b). Each share is one byte x followed by one y byte per secret byte. Three shares leaked. Reconstruct the secret.
      public_inputs:
        field: GF(2^8), polynomial x^8+x^4+x^3+x+1
        shares_hex:
          - 01d9e0e5b54eeeec64e5f9779009069f300e84022e2c7efbe7614e7e9030b2f1d1f210fd929e
          - 032ff7c47de13204e30e5f7dd281bc3dda39e0dc10f3fe64bab6af231ca63f23c038d746a96f
          - 047b775f7870f4a852734a421b9a1d4e87f866821eb46d1523be4d4cad21b2aa0d3ba298850a
        threshold: 3
      submit: the secret as UTF-8
    payload:
      path: "payloads/05-shamir-secret-sharing.age"
      format: "application/json"
      sha256: "20c80c32c736049694292cdf62cc9832ff3ffc20de63a7a36c28ad5e94edd655"
      label: "browser-decryptable"
