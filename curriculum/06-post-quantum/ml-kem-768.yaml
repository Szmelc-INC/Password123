schema_version: 1
lessons:
  - id: "06-ml-kem-768"
    title: "ML-KEM-768"
    module: "06-post-quantum"
    category: "key-encapsulation"
    difficulty: "advanced"
    status: "stable"
    summary: "Module-lattice key encapsulation (NIST FIPS 203). A KEM, not a bulk cipher."
    recommended_for_new_systems: true
    labels: ["public", "encrypted", "browser-decryptable"]
    references:
      - name: "NIST FIPS 203: Module-Lattice-Based Key-Encapsulation Mechanism Standard"
        url: "https://csrc.nist.gov/pubs/fips/203/final"
      - name: "C2SP CCTV: ML-KEM test vectors"
        url: "https://c2sp.org/CCTV/ML-KEM"
    vectors: ["vectors/post-quantum/ml-kem-768.yaml"]
    guide:
      what: >-
        The receiver publishes an encapsulation key. The sender runs Encapsulate to get a random 32-byte shared key and a ciphertext; the receiver runs Decapsulate on the ciphertext to get the same key. Invalid ciphertexts give a pseudo-random key (implicit rejection).
      problem: >-
        Key establishment that is believed to resist quantum computers, defending against "harvest now, decrypt later" collection of today's traffic.
      inputs_outputs: >-
        ML-KEM-768: 1184-byte encapsulation key, 1088-byte ciphertext, 32-byte shared key. A 64-byte seed (d || z) determines the decapsulation key. Formerly known as Kyber.
      key_management: >-
        Use fresh key pairs for ephemeral exchanges. Feed the shared key into an AEAD (KEM-DEM). Deploy as a hybrid with X25519 during migration.
      common_mistakes:
        - "Calling ML-KEM an encryption algorithm for data; it only transports a key."
        - "Dropping the classical component too early; hybrids protect against new lattice attacks."
        - "Underestimating sizes: keys and ciphertexts are about 35 times larger than X25519."
      new_systems: "Yes, in a hybrid with X25519 (for example X25519MLKEM768 in TLS, age1pq recipients)."
      reproduce: |
        p123 vectors verify --lesson 06-ml-kem-768
    challenge:
      prompt: The ML-KEM-768 decapsulation key seed below is challenge-only and public. Decapsulate the KEM ciphertext to get a 32-byte shared key, then open the AES-256-GCM message (12 zero-byte nonce, AAD "ml-kem-768 challenge").
      public_inputs:
        aad_utf8: ml-kem-768 challenge
        aead: AES-256-GCM
        decapsulation_seed_hex: 5e28012dff09000aa00beef1667a6a8ced06c6ac2ff4f4c8e5abe42cc3f72a6ca18710a27acab41b0f14cac3a16737960e51f9f87432c929ee2af181f6e6f1c8
        kem_ciphertext_hex: 
        nonce_hex: "000000000000000000000000"
        sealed_hex: a6ad38a28c96ec7a5c3223935330c733aee45f30b33f67cc7a4c11a25aa00a74ae91e640fc52e1be326f878afe75e45a74ac79064e569317642e4dabc739d99e0b7723
      submit: the shared key and the plaintext
