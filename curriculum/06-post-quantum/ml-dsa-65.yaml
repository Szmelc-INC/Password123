schema_version: 1
lessons:
  - id: "06-ml-dsa-65"
    title: "ML-DSA-65"
    module: "06-post-quantum"
    category: "digital-signature"
    difficulty: "advanced"
    status: "stable"
    summary: "Module-lattice digital signatures (NIST FIPS 204). Signatures, not encryption."
    recommended_for_new_systems: true
    labels: ["public", "encrypted", "browser-decryptable"]
    references:
      - name: "NIST FIPS 204: Module-Lattice-Based Digital Signature Standard"
        url: "https://csrc.nist.gov/pubs/fips/204/final"
      - name: "C2SP CCTV: ML-DSA test vectors"
        url: "https://c2sp.org/CCTV/ML-DSA"
    vectors: ["vectors/post-quantum/ml-dsa-65.yaml"]
    guide:
      what: >-
        A Fiat-Shamir-with-aborts signature over module lattices. The signer samples masks, rejects outputs that would leak the key, and publishes a signature that verifiers check against the public key, message and optional context string.
      problem: >-
        Signatures expected to stay unforgeable against quantum computers, for firmware, software updates and long-lived certificates.
      inputs_outputs: >-
        ML-DSA-65: 32-byte seed, 1952-byte public key, 3309-byte signature. Signing can be hedged (randomized, the default) or deterministic. Formerly known as Dilithium.
      key_management: >-
        Store the 32-byte seed as the private key. Keep signing keys separate from encryption keys and publish public keys through an independent channel.
      common_mistakes:
        - "Labelling ML-DSA as encryption."
        - "Ignoring the context string, which must match between signing and verification."
        - "Not budgeting for the larger key and signature sizes."
      new_systems: "Yes where post-quantum signatures are required, often alongside Ed25519."
      reproduce: |
        p123 vectors verify --lesson 06-ml-dsa-65
    challenge:
      prompt: Which of the three ML-DSA-65 signatures (empty context string) verifies for its message under the public key? Indices start at 0.
      public_inputs:
        context_utf8: ""
        pairs:
          - message_utf8: firmware 4.2.0
            signature_hex: 
          - message_utf8: firmware 4.2.1
            signature_hex: 
          - message_utf8: firmware 4.2.2
            signature_hex: 
        public_key_hex: 
      submit: the index
    payload:
      path: "payloads/06-ml-dsa-65.age"
      format: "application/json"
      sha256: "1b65acaa1061fe0bd296a987376409c19132baacb9d03650a5f869696b598499"
      label: "browser-decryptable"
