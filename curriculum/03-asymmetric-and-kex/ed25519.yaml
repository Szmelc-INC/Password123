schema_version: 1
lessons:
  - id: "03-ed25519"
    title: "Ed25519"
    module: "03-asymmetric-and-kex"
    category: "digital-signature"
    difficulty: "intermediate"
    status: "stable"
    summary: "Deterministic Edwards-curve signatures. Authenticity and integrity, not encryption."
    recommended_for_new_systems: true
    labels: ["public", "encrypted", "browser-decryptable"]
    references:
      - name: "RFC 8032: Edwards-Curve Digital Signature Algorithm (EdDSA)"
        url: "https://www.rfc-editor.org/rfc/rfc8032"
    vectors: ["vectors/asymmetric/ed25519.yaml"]
    guide:
      what: >-
        The signer hashes a 32-byte seed into a scalar and a nonce key, derives the nonce deterministically from the message, and outputs a 64-byte signature (R, S). Anyone with the 32-byte public key can verify it.
      problem: >-
        Proves that the holder of a private key approved exact message bytes. It is used for SSH keys, release signing, and software updates.
      inputs_outputs: >-
        Sign: 32-byte seed and message, giving a 64-byte signature. Verify: public key, message and signature, giving true or false.
      key_management: >-
        Keep signing keys separate from encryption keys. Publish public keys through a channel users can verify independently; plan for revocation and rotation.
      common_mistakes:
        - "Treating a signature as encryption; the message stays public."
        - "Verifying with a public key fetched from the same place as the signed data."
        - "Signing different serializations of the 'same' data."
      new_systems: "Yes. Consider ML-DSA alongside it for long-lived post-quantum signatures."
      reproduce: |
        p123 vectors verify --lesson 03-ed25519
    challenge:
      prompt: A release channel publishes messages signed with Ed25519. Which of the four (message, signature) pairs verify under the public key? Indices start at 0.
