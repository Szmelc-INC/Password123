schema_version: 1
lessons:
  - id: "03-rsa-oaep"
    title: "RSA-OAEP"
    module: "03-asymmetric-and-kex"
    category: "public-key-encryption"
    difficulty: "intermediate"
    status: "stable"
    summary: "RSA encryption with randomized OAEP padding. Secure only with good key generation and padding."
    recommended_for_new_systems: false
    labels: ["public", "encrypted", "browser-decryptable"]
    references:
      - name: "RFC 8017: PKCS #1 v2.2, RSA Cryptography Specifications"
        url: "https://www.rfc-editor.org/rfc/rfc8017"
      - name: "PKCS #1 v2.1 OAEP test vectors (pyca/cryptography mirror)"
        url: "https://github.com/pyca/cryptography/tree/main/vectors/cryptography_vectors/asymmetric/RSA/pkcs-1v2-1d2-vec"
    vectors: ["vectors/asymmetric/rsa-oaep.yaml"]
    guide:
      what: >-
        RSA computes c = m^e mod n. OAEP first mixes the message with a random seed through two mask-generation steps, so the same message encrypts differently every time and the ciphertext is not malleable in useful ways.
      problem: >-
        Anyone with the public key (n, e) can encrypt; only the holder of the private exponent d can decrypt. It was historically used to transport symmetric keys.
      inputs_outputs: >-
        Input: a public key, a short message (at most k - 2*hLen - 2 bytes, 190 bytes for 2048-bit keys with SHA-256), an optional label. Output: a k-byte ciphertext.
      key_management: >-
        Generate p and q independently from a vetted library. Use at least 2048-bit moduli and e = 65537. Protect d, p and q; rotate keys by re-encrypting data keys.
      common_mistakes:
        - "Textbook RSA without padding: deterministic and malleable."
        - "PKCS#1 v1.5 encryption padding, which allows Bleichenbacher padding-oracle attacks."
        - "Bad key generation, such as primes that are too close (Fermat) or shared between keys."
        - "Encrypting bulk data with RSA instead of wrapping a symmetric key."
      new_systems: "Prefer X25519 or ML-KEM key establishment (or HPKE). Use RSA-OAEP only for compatibility."
      reproduce: |
        p123 vectors verify --lesson 03-rsa-oaep
    challenge:
      prompt: 'This 2048-bit RSA key was generated badly: its two primes are very close together. Factor n, rebuild the private key, and decrypt the RSA-OAEP ciphertext (SHA-256, MGF1-SHA-256, label "password123").'
      public_inputs:
        ciphertext_hex: 
        e: 65537
        n_hex: 
        oaep_hash: SHA-256
        oaep_label_utf8: password123
      submit: p, q and the plaintext
    payload:
      path: "payloads/03-rsa-oaep.age"
      format: "application/json"
      sha256: "4ad933f0c1337796c7efaf7c79c6abc6251b98c5767730e2d8acac2177e95ff4"
      label: "browser-decryptable"
