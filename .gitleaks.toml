# Gitleaks configuration: the default rules plus one narrow allowlist.
title = "Password123 gitleaks config"

[extend]
useDefault = true

# The demo identity is PUBLIC BY DESIGN and opens demo payloads only
# (enforced by `p123 validate` and web/test). Nothing else is allowlisted.
[[allowlists]]
description = "Published demo-only age identity"
paths = ['''^demo/demo-identity\.txt$''']

# age ciphertext is random bytes; payloads are checked by p123 validate instead.
[[allowlists]]
description = "Encrypted age payloads"
paths = ['''^payloads/[a-z0-9-]+\.age$''']

# Challenge public inputs include deliberately public, challenge-only key
# material (for example the HMAC challenge key). Only these exact field names
# under curriculum/ are allowed; any other key-like value still fails.
[[allowlists]]
description = "Challenge-only public key material in lesson manifests"
condition = "AND"
paths = ['''^curriculum/0[1-6]-[a-z-]+/[a-z0-9-]+\.yaml$''']
regexTarget = "line"
regexes = ['''^\s+(key_hex|key_material_hex|derived_key_hex|your_private_key_hex|decapsulation_seed_hex): [0-9a-f]+$''']
