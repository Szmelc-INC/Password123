lesson_id: "05-shamir-secret-sharing"
algorithm: "Shamir's Secret Sharing over GF(2^8)"
vectors:
  - id: "property-3-of-5"
    kind: "property"
    status: "verified"
    verifier: "shamir-gf256-property"
    source:
      document: "Shamir, How to Share a Secret, Communications of the ACM 22(11), 1979"
      url: "https://doi.org/10.1145/359168.359176"
    params:
      shares: { int: 5 }
      threshold: { int: 3 }
    inputs:
      secret: { utf8: "correct horse battery staple" }
    notes: "There is no standard byte-level SSS test vector. This is a randomized self-check: every window of 3 shares reconstructs the secret and 2 shares do not."
